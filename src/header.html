<!-- Mobile Menu Styles -->
<style>
@media (max-width: 768px) {
  .mob-toggle { display: flex !important; }
  
  nav {
    position: absolute;
    top: 70px;
    left: 0;
    right: 0;
    background: var(--navy);
    flex-direction: column;
    padding: 1rem 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 2001;
  }
  nav.mobile-open { max-height: 700px; }
  
  .nav-item { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .nav-link { height: auto; padding: 14px 20px; justify-content: space-between; }
  .dropdown { position: static; display: none; background: transparent; padding: 0 20px 10px; }
  .nav-item.open .dropdown { display: block; }
  .nav-item.open .nav-link { color: #fff; }
}
</style>

<!-- Mobile Menu JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.querySelector('.mob-toggle');
  const nav = document.querySelector('nav');
  
  if (toggle && nav) {
    toggle.addEventListener('click', function() {
      nav.classList.toggle('mobile-open');
      this.classList.toggle('active');
    });
  }

  // Submenu toggle
  document.querySelectorAll('.nav-item').forEach(item => {
    const link = item.querySelector('.nav-link');
    if (link && item.querySelector('.dropdown')) {
      link.addEventListener('click', function(e) {
        if (window.innerWidth <= 768) {
          e.preventDefault();
          item.classList.toggle('open');
        }
      });
    }
  });
});
</script>
